<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23232018%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%23c0794d%27/%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册激活课程｜M Branding.aigc · AI 分身视频实战课</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
  <link rel="stylesheet" href="portal.css">
</head>
<body class="auth-page">
  <header class="studio-head">
    <a class="studio-logo latin" href="./index.html"><span class="studio-dot"></span>M BRANDING.AIGC</a>
    <nav class="studio-nav">
      <a href="./index.html">返回课程介绍</a>
      <a class="nav-pill" href="./login.html">已有账号登录</a>
    </nav>
  </header>

  <main class="auth-center">
    <div class="auth-card">
      <div class="dock-brand mono">ACTIVATE COURSE</div>
      <h1>凭 Registration Code 注册</h1>
      <p class="sub">付款确认后，你的邮箱会收到 HeyAIGC 发出的 Registration Code。填写邮箱、注册码并设置登录密码即可开课。</p>
      <form id="regForm">
        <div class="fg">
          <label for="email">付款邮箱</label>
          <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="fg">
          <label for="code">Registration Code</label>
          <input id="code" type="text" required autocomplete="off" placeholder="例如 HEY-XXXX-XXXX" style="text-transform:uppercase">
        </div>
        <div class="fg">
          <label for="password">设置密码（至少 8 位）</label>
          <input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="设置你的课程登录密码">
        </div>
        <div class="fg">
          <label for="password2">确认密码</label>
          <input id="password2" type="password" required minlength="8" autocomplete="new-password" placeholder="再输入一次密码">
        </div>
        <button class="btn-primary" id="submitBtn" type="submit">验证并开通课程</button>
        <div class="msg" id="msgBox"></div>
      </form>
      <div class="dock-foot">
        <a href="./login.html">← 已经注册过？直接登录</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth-common.js"></script>
  <script>
    (async function () {
      const { session, enrollment } = await window.checkActiveEnrollment();
      if (session && enrollment) {
        location.replace("./index.html");
        return;
      }
      const form = document.getElementById("regForm");
      const btn = document.getElementById("submitBtn");
      const msg = document.getElementById("msgBox");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.className = "msg";
        msg.textContent = "";
        const email = document.getElementById("email").value.trim().toLowerCase();
        const code = document.getElementById("code").value.trim().toUpperCase();
        const password = document.getElementById("password").value;
        const password2 = document.getElementById("password2").value;
        if (password !== password2) {
          msg.className = "msg is-err";
          msg.textContent = "两次输入的密码不一致，请确认。";
          return;
        }
        btn.disabled = true;
        btn.textContent = "验证注册码中…";
        try {
          await window.registerWithCode({ email, code, password });
          msg.className = "msg is-ok";
          msg.textContent = "注册成功，正在进入课程…";
          location.replace("./index.html");
        } catch (err) {
          msg.className = "msg is-err";
          msg.textContent = err.message || "注册失败，请检查后再试。";
          btn.disabled = false;
          btn.textContent = "验证并开通课程";
        }
      });
    })();
  </script>
</body>
</html>
